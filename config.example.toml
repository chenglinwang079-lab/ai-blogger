[api]
openai_api_key = ""  # 推荐使用 MIMO_API_KEY 或 OPENAI_API_KEY 环境变量
openai_base_url = "https://api.xiaomimimo.com/v1"
pexels_api_key_env = "PEXELS_API_KEY"
pixabay_api_key_env = "PIXABAY_API_KEY"

[models]
script_model = "mimo-v2.5-pro"
score_model = "mimo-v2.5-pro"
predict_model = "mimo-v2.5-pro"

[paths]
voxcpm_model = "D:/voxcpm/pretrained_models/VoxCPM2"
fonts_dir = "assets/fonts"
bgm_dir = "assets/bgm"
footage_dir = "assets/footage"
output_dir = "dist"
cheat_root = "cheat"

[quality]
score_scale = 10
score_threshold = 7.5
max_rewrites = 3

[llm]
max_retries = 3
retry_delay_seconds = 5
timeout_seconds = 60

[tts]
# 生产默认 edge-tts（稳定，无需 GPU）
# VoxCPM2 仅在手动改为 voxcpm2 或 hybrid 时启用
backend = "edge-tts"          # "edge-tts" | "voxcpm2" | "hybrid"
                              # edge-tts: 稳定，无需 GPU
                              # voxcpm2/hybrid: 子进程隔离，失败自动 fallback edge-tts
max_segment_chars = 100
sample_rate = 48000
voxcpm_optimize = false       # VoxCPM2 内存优化（voxcpm2/hybrid 专用）
voxcpm_subprocess = true      # 预留/推荐配置；当前 voxcpm2 模式固定使用子进程隔离
voxcpm_timeout_seconds = 180  # 子进程超时秒数

[video]
resolution = "1080x1920"
bgm_volume = 0.15
subtitle_font = "Microsoft YaHei"
subtitle_fontsize = 42
render_mode = "gradient"   # "gradient" | "footage"
background_style = "tech_grid"  # "tech_grid" | "dot_matrix" | "gradient"
keyword_highlight = true        # 字幕中高亮 visual_keyword（best-effort）
subtitle_shadow = true          # 字幕文字阴影
subtitle_stroke_width = 3       # 字幕描边宽度（默认 2）
subtitle_shadow_offset = 3      # 阴影偏移量（默认 2）
subtitle_shadow_alpha = 120     # 阴影透明度（默认 80，0-255）
bgm_fade_seconds = 2.0          # BGM 淡入淡出时长（秒）
bgm_duck_ratio = 0.4            # TTS 说话时 BGM 音量比例（0.4 = 降到 40%）
transition_duration = 0.3       # 段间 crossfade 时长（秒），0 禁用

[stock]
# 未来自动补素材开关；手动 CLI/WebUI 始终可执行
auto_fill_enabled = false
provider_order = ["pexels", "pixabay"]
max_downloads_per_keyword = 2
cache_hours = 24
orientation = "portrait"
min_width = 720
min_height = 1280

[thumbnail]
keyword_ratio = 1.8          # 关键词字号 = base_font_size * keyword_ratio
accent_color = "100,180,255"  # 分割线颜色 RGB

[export.douyin]
title_max = 55
desc_max = 1000
tag_format = "hashtag"       # "hashtag" → "#话题" 空格分隔
tag_max = 10
thumb_width = 1080
thumb_height = 1920

[export.kuaishou]
title_max = 30
desc_max = 500
tag_format = "hashtag"
tag_max = 8
thumb_width = 1080
thumb_height = 1920

[export.bilibili]
title_max = 80
desc_max = 2000
tag_format = "comma"         # 逗号分隔
tag_max = 12
thumb_width = 1920
thumb_height = 1080
