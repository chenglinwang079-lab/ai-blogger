[api]
openai_api_key = ""  # 推荐使用 MIMO_API_KEY 或 OPENAI_API_KEY 环境变量
openai_base_url = "https://api.xiaomimimo.com/v1"
pexels_api_key_env = "PEXELS_API_KEY"
pixabay_api_key_env = "PIXABAY_API_KEY"

[models]
script_model = "mimo-v2.5-pro"
score_model = "mimo-v2.5-pro"
predict_model = "mimo-v2.5-pro"

[paths]
voxcpm_model = "D:/voxcpm/pretrained_models/VoxCPM2"
fonts_dir = "assets/fonts"
bgm_dir = "assets/bgm"
footage_dir = "assets/footage"
output_dir = "dist"
cheat_root = "cheat"

[quality]
score_scale = 10
score_threshold = 7.5
max_rewrites = 3

[llm]
max_retries = 3
retry_delay_seconds = 5
timeout_seconds = 60

[tts]
backend = "voxcpm2"
fallback = "edge-tts"
max_segment_chars = 100
sample_rate = 48000

[video]
resolution = "1080x1920"
bgm_volume = 0.15
subtitle_font = "Microsoft YaHei"
subtitle_fontsize = 42
render_mode = "gradient"   # "gradient" | "footage"

[stock]
# 未来自动补素材开关；手动 CLI/WebUI 始终可执行
auto_fill_enabled = false
provider_order = ["pexels", "pixabay"]
max_downloads_per_keyword = 2
cache_hours = 24
orientation = "portrait"
min_width = 720
min_height = 1280

[export.douyin]
title_max = 55
desc_max = 1000
tag_format = "hashtag"       # "hashtag" → "#话题" 空格分隔
tag_max = 10
thumb_width = 1080
thumb_height = 1920

[export.kuaishou]
title_max = 30
desc_max = 500
tag_format = "hashtag"
tag_max = 8
thumb_width = 1080
thumb_height = 1920

[export.bilibili]
title_max = 80
desc_max = 2000
tag_format = "comma"         # 逗号分隔
tag_max = 12
thumb_width = 1920
thumb_height = 1080
